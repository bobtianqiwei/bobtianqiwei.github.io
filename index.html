  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var video = document.querySelector(".background-video video");
      var notice = document.querySelector(".video-autoplay-notice");
      var isTouchDevice = navigator.maxTouchPoints > 0;

      if (!video || !notice || !isTouchDevice) return;

      function showNotice() {
        notice.classList.add("is-visible");
      }

      video.addEventListener("playing", function () {
        notice.classList.remove("is-visible");
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        showNotice();
        return;
      }

      var playAttempt = video.play();
      if (playAttempt) playAttempt.catch(showNotice);
    });
  </script>
