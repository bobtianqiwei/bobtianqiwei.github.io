  <style>
    body { min-height: 100vh; margin: 0; }
    .contact-card-page { min-height: 100vh; display: grid; place-items: center; padding: 56px 24px; box-sizing: border-box; }
    .contact-card { width: min(100%, 720px); }
    .contact-card, .contact-card * { border-radius: 0 !important; }
    .contact-card-back { display: inline-block; margin-bottom: 32px; color: var(--theme-muted, #6b6b6b); font-family: Manrope Variablefont Wght, Arial, sans-serif; font-size: 13px; text-decoration: none; }
    .contact-card-layout { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 64px; align-items: start; padding-top: 32px; border-top: 1px solid var(--theme-border, #ddd); }
    .contact-card-photo { display: block; width: 128px; height: 128px; margin: 0 0 28px; object-fit: cover; }
    .contact-card-name { margin: 0 0 8px; font-family: Manrope Variablefont Wght, Arial, sans-serif; font-size: clamp(32px, 5vw, 46px); font-weight: 500; line-height: 1.05; }
    .contact-card-role { margin: 0 0 32px; color: var(--theme-muted, #6b6b6b); font-family: Manrope Variablefont Wght, Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    .contact-card-details { border-top: 1px solid var(--theme-border, #ddd); font-family: Manrope Variablefont Wght, Arial, sans-serif; font-size: 13px; }
    .contact-card-detail { display: flex; justify-content: space-between; gap: 24px; padding: 10px 0; border-bottom: 1px solid var(--theme-border, #ddd); }
    .contact-card-label { color: var(--theme-muted, #6b6b6b); }
    .contact-card-details a { color: inherit; text-align: right; text-decoration: none; }
    .contact-card-qr-panel { text-align: center; }
    .contact-card-qr-link { display: block; width: 100%; margin: 0 0 20px; }
    .contact-card-qr { display: block; width: 100%; height: auto; background: #fff; }
    .contact-card-action { display: block; padding: 11px 16px; background: var(--theme-button-fill, #111); color: var(--theme-bg, #fff) !important; font-family: Manrope Variablefont Wght, Arial, sans-serif; font-size: 13px; text-align: center; text-decoration: none; }
    .contact-card-hint { margin: 12px 0 0; color: var(--theme-muted, #6b6b6b); font-family: Manrope Variablefont Wght, Arial, sans-serif; font-size: 11px; line-height: 1.4; }
    @media (max-width: 640px) {
      .contact-card-page { display: block; padding: 24px 20px; }

      .contact-card-layout { grid-template-columns: 1fr; gap: 20px; padding-top: 20px; }
      .contact-card-photo { width: 88px; height: 88px; margin-bottom: 18px; }
      .contact-card-name { font-size: 32px; }
      .contact-card-role { margin-bottom: 20px; }
      .contact-card-detail { padding: 8px 0; }
      .contact-card-qr-panel { width: min(100%, 160px); margin: 0 auto; }
      .contact-card-qr-link { margin-bottom: 14px; }
      .contact-card-hint { margin-top: 8px; }
