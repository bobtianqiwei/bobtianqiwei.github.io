<html lang="en">

  <script async src="/js/posthog.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --cover: light-dark(#fff, #141414);
      --ink: light-dark(#182840, #f6f8ff);
      --wallpaper-width: max(100vw, calc(100dvh * 16 / 9));
      --wallpaper-height: max(100dvh, calc(100vw * 9 / 16));
    }

    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cover);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    .stage {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 16px;
      overflow: clip;
      position: relative;
    }

    .message { text-align: center; }

    [data-drift] {
      position: relative;
      translate: var(--x, 0px) var(--y, 0px);
    }

    .links a { z-index: 1; }
    .links a:is(:hover, :focus) { z-index: 2; }

    .art {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 2vw, 24px);
    }

    .code {
      display: flex;
      gap: clamp(4px, 1.5vw, 12px);
      font-size: clamp(4rem, 19vw, 13rem);
      font-weight: 900;
      line-height: .95;
    }

    .portrait {
      display: block;
      width: clamp(72px, 24vw, 176px);
      height: auto;
    }

    h1 {
      width: fit-content;
      margin: .55em auto .25em;
      font-size: clamp(1.75rem, 6vw, 3.75rem);
      font-weight: 850;
      line-height: 1.06;
    }

    p {
      width: fit-content;
      max-width: 36ch;
      margin: 0 auto;
      font-weight: 750;
      line-height: 1.4;
    }

    @supports (background-clip: text) and (color: light-dark(black, white)) {
      .wallpaper-ready .wallpaper-text {
        background-image: url("/swe/winxp/static/media/wallpapers/bliss.jpg");
        background-size: var(--wallpaper-width) var(--wallpaper-height);
        background-position:
          calc((100vw - var(--wallpaper-width)) / 2 - var(--ink-x) - var(--x))
          calc((100dvh - var(--wallpaper-height)) / 2 - var(--ink-y) - var(--y));
        background-repeat: no-repeat;
        background-origin: border-box;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: .35px var(--ink);
      }
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
    }

    .links a { text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .links a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    .home-link {
      padding: 9px 18px;
      border: 1px solid var(--ink);
      color: var(--ink);
      font-weight: 650;
    }

    .computer-link {
      display: grid;
      overflow: hidden;
      border: 3px solid #0d5cd7;
      border-radius: 8px 8px 0 0;
      box-shadow: 3px 6px 14px #0005;
      color: var(--ink);
      font: 700 13px Tahoma, "Noto Sans", sans-serif;
    }

    /* Match the Control Panel window in /swe/winxp/. */
    .computer-title {
      padding: 7px 9px;
      color: #fff;
      background: linear-gradient(
        to bottom,
        #0058ee 0%,
        #3593ff 4%,
        #288eff 6%,
        #127dff 8%,
        #036ffc 10%,
        #0262ee 14%,
        #0057e5 20%,
        #0054e3 24%,
        #0055eb 56%,
        #005bf5 66%,
        #026afe 76%,
        #0062ef 86%,
        #0052d6 92%,
        #0040ab 94%,
        #003092 100%
      );
      text-shadow: 1px 1px #0009;
    }

    .computer-body {
      display: grid;
      place-items: center;
      padding: 5px;
      background: linear-gradient(#f6f4ea, #ece9d8);
    }

    @media (min-width: 760px) {
      .message {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        row-gap: clamp(12px, 3vh, 32px);
        width: min(100%, 1320px);
        justify-items: center;
        align-items: center;
      }

      .art, .code { display: contents; }
      .code span:nth-child(1) { grid-area: 2 / 1 / 4; }
      .code span:nth-child(2) { grid-area: 1 / 1; align-self: start; }
      .code span:nth-child(3) { grid-area: 1 / 3 / 4; }
      .portrait { grid-area: 1 / 2; }
      h1 { grid-area: 2 / 2; margin: 0; }
      p { grid-area: 3 / 2; }
      .links {
        grid-area: 4 / 1 / 5 / 4;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        justify-self: stretch;
        justify-items: center;
        gap: 0;
        margin: 0;
      }

      .computer-link { grid-column: 3; }
    }

    @media (forced-colors: active) {
      .wallpaper-ready .wallpaper-text { background: none; color: CanvasText; -webkit-text-stroke: 0; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="message">
      <div class="art">
        <div class="code" role="img" aria-label="404">
          <span class="wallpaper-text" data-drift>4</span><span class="wallpaper-text" data-drift>0</span><span class="wallpaper-text" data-drift>4</span>
        </div>
        <img class="portrait" data-drift src="/images/Subject-3-p-500.png" width="914" height="1030" alt="Bob Tianqi Wei">
      </div>
      <h1 class="wallpaper-text" data-drift>Haha<br>Page Not Found</h1>
      <p class="wallpaper-text" data-drift>The page you are looking for doesn't exist or has been moved.</p>
      <nav class="links" aria-label="Where to go next">
        <a class="home-link wallpaper-text" data-drift href="/">Home</a>
        <a class="computer-link" data-drift href="/swe/?power=off">
          <span class="computer-title">Bob's Childhood Computer</span>
          <span class="computer-body"><img src="/swe/winxp/static/media/xp/my-computer.png" width="32" height="32" alt=""></span>
        </a>
      </nav>
    </main>
  </div>
  <script>
    const stage = document.querySelector(".stage");
    const message = document.querySelector(".message");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const velocities = [[-7, -6], [3, -9], [9, -4], [7, 6], [-9, 3], [6, 7], [-6, 9], [9, 4]];
    const items = Array.from(message.querySelectorAll("[data-drift]"), (element, index) => ({
      element,
      dx: velocities[index][0],
      dy: velocities[index][1],
      x: 0,
      y: 0
    }));
    let previousTime;
    let frame;

    function positionItems() {
      for (const item of items) {
        item.element.style.setProperty("--x", (item.x - item.startX) + "px");
        item.element.style.setProperty("--y", (item.y - item.startY) + "px");
      }
    }

    function moveAxis(axis, crossAxis, size, crossSize, velocity, extent, elapsed) {
      const padding = 16;
      const before = items.map(item => item[axis]);

      for (const item of items) {
        if (item.paused) continue;
        const end = Math.max(padding, extent - padding - item[size]);
        const next = item[axis] + item[velocity] * elapsed;
        item[axis] = Math.max(padding, Math.min(end, next));
        if (next < padding || next > end) item[velocity] *= -1;
      }

      // Resolve contacts on one axis at a time so the bounce follows the edge that was hit.
      for (let i = 0; i < items.length; i++) {
        for (let j = i + 1; j < items.length; j++) {
          const a = items[i];
          const b = items[j];
          const overlapsAcross = a[crossAxis] < b[crossAxis] + b[crossSize] &&
            b[crossAxis] < a[crossAxis] + a[crossSize];
          const overlapsNow = a[axis] < b[axis] + b[size] && b[axis] < a[axis] + a[size];
          const startedApart = before[i] + a[size] <= before[j] || before[j] + b[size] <= before[i];
          if (!overlapsAcross || !overlapsNow || !startedApart) continue;

          a[axis] = before[i];
          b[axis] = before[j];
          if (a.paused) b[velocity] *= -1;
          else if (b.paused) a[velocity] *= -1;
          else [a[velocity], b[velocity]] = [b[velocity], a[velocity]];
        }
      }
    }

    function move(time) {
      const elapsed = Math.min((time - (previousTime ?? time)) / 1000, .05);
      previousTime = time;

      for (const item of items) {
        item.paused = item.element.matches("a:hover, a:focus");
      }

      moveAxis("x", "y", "width", "height", "dx", stage.clientWidth, elapsed);
      moveAxis("y", "x", "height", "width", "dy", stage.clientHeight, elapsed);
      positionItems();
      frame = requestAnimationFrame(move);
    }

    function updateLayout() {
      cancelAnimationFrame(frame);
      previousTime = undefined;

      // Use the original layout as the starting point and anchor all cutouts to the same wallpaper.
      for (const item of items) {
        const { element } = item;
        item.x = item.startX = element.offsetLeft;
        item.y = item.startY = element.offsetTop;
        item.width = element.offsetWidth;
        item.height = element.offsetHeight;
        element.style.setProperty("--ink-x", item.startX + "px");
        element.style.setProperty("--ink-y", item.startY + "px");
      }

      positionItems();
      if (!reducedMotion.matches) frame = requestAnimationFrame(move);
    }

    const layout = new ResizeObserver(updateLayout);
    layout.observe(stage);
    layout.observe(message);
    reducedMotion.addEventListener("change", updateLayout);

    const wallpaper = new Image();
    wallpaper.onload = () => {
      message.classList.add("wallpaper-ready");
    };
    wallpaper.src = "/swe/winxp/static/media/wallpapers/bliss.jpg";
  </script>
</body>
</html>
