  <style>
    :root {
      --cropkit-phi: 1.618;
      --cropkit-button-x: 1em;
      --cropkit-button-height: 1.272em;
      --cropkit-button-gap: 0.618em;
      --cropkit-button-radius: 0;
      --cropkit-chip-pad-y: calc((var(--cropkit-button-height) - 1em) / 2 + 0.16em);
      --cropkit-chip-pad-x: calc(var(--cropkit-button-x) * 0.82);
      --cropkit-bg: #ffffff;
      --cropkit-panel: #ffffff;
      --cropkit-surface: #fafafa;
      --cropkit-surface-2: #f3f3f3;
      --cropkit-text: #111111;
      --cropkit-text-muted: #666666;
      --cropkit-text-soft: #777777;
      --cropkit-text-faint: #888888;
      --cropkit-line: #d5d5d5;
      --cropkit-line-dashed: #cfcfcf;
      --cropkit-line-strong: #c9c9c9;
      --cropkit-line-soft: #ececec;
      --cropkit-button-fill: #e0e0e0;
      --cropkit-button-fill-hover: #ececec;
      --cropkit-button-secondary: #f7f7f7;
      --cropkit-chip-fill: #f7f7f7;
      --cropkit-chip-fill-active: #e2e2e2;
      --cropkit-slider-track: #d8d8d8;
      --cropkit-slider-thumb: #a6a6a6;
      --cropkit-slider-thumb-hover: #7f7f7f;
      --cropkit-slider-thumb-active: #666666;
    }

    html[data-theme="dark"] {
      --cropkit-bg: #141414;
      --cropkit-panel: #141414;
      --cropkit-surface: #1d1d1d;
      --cropkit-surface-2: #242424;
      --cropkit-text: #efefef;
      --cropkit-text-muted: #b7b7b7;
      --cropkit-text-soft: #9e9e9e;
      --cropkit-text-faint: #8a8a8a;
      --cropkit-line: #3b3b3b;
      --cropkit-line-dashed: #454545;
      --cropkit-line-strong: #505050;
      --cropkit-line-soft: #2a2a2a;
      --cropkit-button-fill: #303030;
      --cropkit-button-fill-hover: #3a3a3a;
      --cropkit-button-secondary: #212121;
      --cropkit-chip-fill: #212121;
      --cropkit-chip-fill-active: #323232;
      --cropkit-slider-track: #3a3a3a;
      --cropkit-slider-thumb: #8f8f8f;
      --cropkit-slider-thumb-hover: #b0b0b0;
      --cropkit-slider-thumb-active: #d0d0d0;
    }

    body.edge-trim-lab-page {
      margin: 0;
      color: var(--cropkit-text);
      background: var(--cropkit-bg);
      font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif;
    }

    .edge-trim-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 18px auto 40px;
    }

    .edge-trim-hero {
      padding: 0;
    }

    .edge-trim-hero h1 {
      margin: 0 0 12px;
      font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .edge-trim-grid {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .edge-trim-panel {
      border: none;
      border-radius: 0;
      background: var(--cropkit-panel);
      box-shadow: none;
    }

    .edge-trim-controls {
      padding: 0;
      display: grid;
      gap: 10px;
      position: sticky;
      top: 18px;
    }

    .edge-trim-section-title {
      margin: 0 0 3px;
      font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: var(--cropkit-text-muted);
    }

    .edge-trim-dropzone {
      border: 1px dashed var(--cropkit-line-dashed);
      border-radius: 0;
      min-height: 78px;
      padding: 12px;
      background: var(--cropkit-surface);
      display: grid;
      place-items: center;
      text-align: center;
      transition: background 160ms ease, border-color 160ms ease;
      cursor: pointer;
    }

    .edge-trim-dropzone.is-dragging {
      background: var(--cropkit-surface-2);
      border-color: var(--cropkit-text-faint);
    }

    .edge-trim-dropzone strong {
      display: block;
      margin-bottom: 2px;
      font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .edge-trim-dropzone span,
    .edge-trim-note,
    .edge-trim-empty,
    .edge-trim-status {
      color: var(--cropkit-text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .edge-trim-input {
      display: none;
    }

    .edge-trim-toggle-group,
    .edge-trim-range-group,
    .edge-trim-actions {
      display: grid;
      gap: 6px;
    }

    .edge-trim-toggle-group label,
    .edge-trim-range-group label {
      display: grid;
      gap: 3px;
      font-size: 12px;
      font-weight: 600;
    }

    .edge-trim-radio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .edge-trim-radio-row.compact span {
      min-width: calc(var(--cropkit-button-x) * 3.8);
      padding: var(--cropkit-chip-pad-y) calc(var(--cropkit-chip-pad-x) * 0.82);
      font-size: 11px;
      line-height: 1;
    }

    .edge-trim-radio-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .edge-trim-radio-row span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: calc(var(--cropkit-button-x) * 4.4);
      min-height: calc(var(--cropkit-button-height) + (var(--cropkit-button-x) * 0.52));
      padding: var(--cropkit-chip-pad-y) var(--cropkit-chip-pad-x);
      border-radius: var(--cropkit-button-radius);
      border: 1px solid var(--cropkit-line);
      background: var(--cropkit-chip-fill);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      transition: all 160ms ease;
    }

    .edge-trim-radio-row input:checked + span {
      background: var(--cropkit-chip-fill-active);
      color: var(--cropkit-text);
      border-color: var(--cropkit-line-strong);
    }

    .edge-trim-range-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--cropkit-text-soft);
      font-size: 11px;
      font-weight: 600;
    }

    .edge-trim-range-group input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer;
    }

    .edge-trim-range-group input[type="range"]:focus {
      outline: none;
    }

    .edge-trim-range-group input[type="range"]::-webkit-slider-runnable-track {
      height: 2px;
      background: var(--cropkit-slider-track);
      border: none;
    }

    .edge-trim-range-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      margin-top: -5px;
      border-radius: 999px;
      border: none;
      background: var(--cropkit-slider-thumb);
      transition: background 160ms ease, transform 160ms ease;
    }

    .edge-trim-range-group input[type="range"]:hover::-webkit-slider-runnable-track {
      background: var(--cropkit-slider-track);
    }

    .edge-trim-range-group input[type="range"]:hover::-webkit-slider-thumb {
      background: var(--cropkit-slider-thumb-hover);
      transform: scale(1.06);
    }

    .edge-trim-range-group input[type="range"]:active::-webkit-slider-thumb {
      background: var(--cropkit-slider-thumb-active);
      transform: scale(1.08);
    }

    .edge-trim-range-group input[type="range"]::-moz-range-track {
      height: 2px;
      background: var(--cropkit-slider-track);
      border: none;
      border-radius: 0;
    }

    .edge-trim-range-group input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: none;
      background: var(--cropkit-slider-thumb);
      transition: background 160ms ease, transform 160ms ease;
    }

    .edge-trim-range-group input[type="range"]:hover::-moz-range-track {
      background: var(--cropkit-slider-track);
    }

    .edge-trim-range-group input[type="range"]:hover::-moz-range-thumb {
      background: var(--cropkit-slider-thumb-hover);
      transform: scale(1.06);
    }

    .edge-trim-range-group input[type="range"]:active::-moz-range-thumb {
      background: var(--cropkit-slider-thumb-active);
      transform: scale(1.08);
    }

    .edge-trim-color-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .edge-trim-color-input {
      width: 36px;
      height: 24px;
      border: 1px solid var(--cropkit-line);
      background: var(--cropkit-panel);
      padding: 0;
      cursor: pointer;
    }

    .edge-trim-config-panel[hidden] {
      display: none;
    }

    .edge-trim-button,
    .edge-trim-secondary-button {
      appearance: none;
      border: 1px solid var(--cropkit-line);
      border-radius: var(--cropkit-button-radius);
      min-height: calc(var(--cropkit-button-height) + (var(--cropkit-button-x) * 0.7));
      padding: calc((var(--cropkit-button-height) - 1em) / 2 + 0.24em) calc(var(--cropkit-button-x) * 0.82);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, opacity 160ms ease;
    }

    .edge-trim-button {
      color: var(--cropkit-text);
      background: var(--cropkit-button-fill);
      border-color: var(--cropkit-line-strong);
    }

    .edge-trim-secondary-button {
      color: var(--cropkit-text);
      background: var(--cropkit-button-secondary);
    }

    .edge-trim-button:hover,
    .edge-trim-secondary-button:hover {
      background: var(--cropkit-button-fill-hover);
      color: var(--cropkit-text);
    }

    .edge-trim-actions {
      align-items: start;
    }

    .edge-trim-actions-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    .edge-trim-card-actions .edge-trim-button,
    .edge-trim-card-actions .edge-trim-secondary-button,
    .edge-trim-actions .edge-trim-button,
    .edge-trim-actions .edge-trim-secondary-button,
    .edge-trim-results-head .edge-trim-secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--cropkit-button-gap);
      width: fit-content;
    }

    .edge-trim-actions-buttons .edge-trim-button,
    .edge-trim-actions-buttons .edge-trim-secondary-button {
      width: 100%;
    }

    .edge-trim-config-panel {
      display: grid;
      gap: 10px;
    }

    .edge-trim-button:disabled,
    .edge-trim-secondary-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .edge-trim-results {
      padding: 0;
      min-width: 0;
    }

    .edge-trim-results-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--cropkit-line-soft);
    }

    .edge-trim-results-grid {
      display: grid;
      gap: 14px;
    }

    .edge-trim-card {
      padding: 0 0 14px;
      border: none;
      border-bottom: 1px solid var(--cropkit-line-soft);
      border-radius: 0;
      background: #fff;
    }

    .edge-trim-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .edge-trim-card-title {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }

    .edge-trim-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 0;
      border-radius: 0;
      border: none;
      background: transparent;
      color: var(--cropkit-text-faint);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .edge-trim-preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .edge-trim-preview {
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
    }

    .edge-trim-preview-label {
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: lowercase;
      color: var(--cropkit-text-soft);
    }

    .edge-trim-preview img {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: var(--cropkit-surface);
    }

    .edge-trim-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      color: var(--cropkit-text-muted);
      font-size: 12px;
    }

    .edge-trim-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    @media (max-width: 991px) {
      .edge-trim-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .edge-trim-controls {
        position: static;
      }
    }

    @media (max-width: 767px) {
      .edge-trim-shell {
        width: min(100% - 18px, 100%);
        margin-top: 14px;
        margin-bottom: 28px;
      }

      .edge-trim-hero,
      .edge-trim-controls,
      .edge-trim-results {
        padding: 0;
      }

      .edge-trim-preview-grid,
      .edge-trim-results-head,
      .edge-trim-card-top {
        display: grid;
      }

      .edge-trim-preview-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="edge-trim-lab-page">
  <div data-collapse="small" data-animation="over-right" data-duration="400" id="navigation" data-easing="ease" data-easing2="ease" role="banner" class="navigation w-nav">

        <nav role="navigation" class="navigation-items w-nav-menu">

      </div>

  <main class="edge-trim-shell">
    <section class="edge-trim-hero">
      <h1>cropkit</h1>

      <div class="edge-trim-grid">
        <aside class="edge-trim-panel edge-trim-controls">
          <div>
            <h2 class="edge-trim-section-title">upload</h2>
            <label class="edge-trim-dropzone" id="dropzone" for="image-input">
              <div>
                <strong>drop images here</strong>
                <span>or click to choose</span>
              </div>
            </label>
            <input class="edge-trim-input" id="image-input" type="file" accept="image/*" multiple>
          </div>

          <div class="edge-trim-toggle-group">
            <h2 class="edge-trim-section-title">operation</h2>
            <label>
              <div class="edge-trim-radio-row">
                <label>
                  <input type="radio" name="tool-mode" value="trim" checked>
                  <span>trim</span>
                </label>
                <label>
                  <input type="radio" name="tool-mode" value="pad">
                  <span>pad</span>
                </label>
              </div>
            </label>
          </div>

          <div class="edge-trim-config-panel" id="trim-config">
            <div class="edge-trim-toggle-group">
              <h2 class="edge-trim-section-title">border</h2>
              <label>
                <div class="edge-trim-radio-row">
                  <label>
                    <input type="radio" name="trim-mode" value="auto" checked>
                    <span>Auto</span>
                  </label>
                  <label>
                    <input type="radio" name="trim-mode" value="white">
                    <span>White</span>
                  </label>
                  <label>
                    <input type="radio" name="trim-mode" value="black">
                    <span>Black</span>
                  </label>
                </div>
              </label>
            </div>

            <div class="edge-trim-range-group">
              <h2 class="edge-trim-section-title">settings</h2>
              <label for="tolerance-range">
                <span>tolerance</span>
                <div class="edge-trim-range-meta">
                  <span>strict</span>
                  <strong id="tolerance-value">24</strong>
                  <span>loose</span>
                </div>
                <input id="tolerance-range" type="range" min="4" max="80" step="1" value="24">
              </label>
              <label for="coverage-range">
                <span>edge purity</span>
                <div class="edge-trim-range-meta">
                  <span>90%</span>
                  <strong id="coverage-value">98.5%</strong>
                  <span>100%</span>
                </div>
                <input id="coverage-range" type="range" min="90" max="100" step="0.5" value="98.5">
              </label>
            </div>
          </div>

          <div class="edge-trim-config-panel" id="pad-config" hidden>
            <div class="edge-trim-toggle-group">
              <h2 class="edge-trim-section-title">ratio</h2>
              <label>
                <div class="edge-trim-radio-row compact">
                  <label>
                    <input type="radio" name="pad-ratio" value="1:1">
                    <span>1:1</span>
                  </label>
                  <label>
                    <input type="radio" name="pad-ratio" value="4:5" checked>
                    <span>4:5</span>
                  </label>
                  <label>
                    <input type="radio" name="pad-ratio" value="3:4">
                    <span>3:4</span>
                  </label>
                  <label>
                    <input type="radio" name="pad-ratio" value="2:3">
                    <span>2:3</span>
                  </label>
                  <label>
                    <input type="radio" name="pad-ratio" value="16:9">
                    <span>16:9</span>
                  </label>
                  <label>
                    <input type="radio" name="pad-ratio" value="9:16">
                    <span>9:16</span>
                  </label>
                </div>
              </label>
            </div>

            <div class="edge-trim-toggle-group">
              <h2 class="edge-trim-section-title">border color</h2>
              <label>
                <div class="edge-trim-radio-row compact">
                  <label>
                    <input type="radio" name="pad-bg-preset" value="#ffffff" checked>
                    <span>white</span>
                  </label>
                  <label>
                    <input type="radio" name="pad-bg-preset" value="#f2f2f2">
                    <span>gray</span>
                  </label>
                  <label>
                    <input type="radio" name="pad-bg-preset" value="#000000">
                    <span>black</span>
                  </label>
                </div>
              </label>
              <label for="pad-bg-color">
                <span>custom</span>
                <div class="edge-trim-color-row">
                  <input class="edge-trim-color-input" id="pad-bg-color" type="color" value="#ffffff">
                  <span id="pad-bg-color-value">#ffffff</span>
                </div>
              </label>
            </div>
          </div>

          <div class="edge-trim-actions">
            <div class="edge-trim-actions-buttons">
              <button class="edge-trim-button" id="process-button" type="button">PROCESS</button>
              <button class="edge-trim-secondary-button" id="clear-button" type="button">CLEAR</button>
            </div>
            <div class="edge-trim-status" id="status-text">no images selected.</div>
          </div>
        </aside>

        <section class="edge-trim-panel edge-trim-results">
          <div class="edge-trim-results-head">
            <div>
              <h2 class="edge-trim-section-title">results</h2>
              <div class="edge-trim-status" id="results-summary">add images to start.</div>
            </div>
            <button class="edge-trim-secondary-button" id="download-all-button" type="button" disabled>download all</button>
          </div>
          <div class="edge-trim-results-grid" id="results-grid">
            <div class="edge-trim-empty">processed images appear here.</div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const state = {
        files: [],
        results: []
      };

      const dropzone = document.getElementById("dropzone");
      const input = document.getElementById("image-input");
      const processButton = document.getElementById("process-button");
      const clearButton = document.getElementById("clear-button");
      const downloadAllButton = document.getElementById("download-all-button");
      const statusText = document.getElementById("status-text");
      const resultsSummary = document.getElementById("results-summary");
      const resultsGrid = document.getElementById("results-grid");
      const toleranceRange = document.getElementById("tolerance-range");
      const coverageRange = document.getElementById("coverage-range");
      const toleranceValue = document.getElementById("tolerance-value");
      const coverageValue = document.getElementById("coverage-value");
      const trimConfig = document.getElementById("trim-config");
      const padConfig = document.getElementById("pad-config");
      const padBgColor = document.getElementById("pad-bg-color");
      const padBgColorValue = document.getElementById("pad-bg-color-value");

      Array.from(document.querySelectorAll('input[name="tool-mode"]')).forEach(function (input) {
        input.addEventListener("change", syncVisibleConfig);
      });

      Array.from(document.querySelectorAll('input[name="pad-bg-preset"]')).forEach(function (input) {
        input.addEventListener("change", function () {
          padBgColor.value = input.value;
          padBgColorValue.textContent = input.value.toLowerCase();
        });
      });

      padBgColor.addEventListener("input", function () {
        padBgColorValue.textContent = padBgColor.value.toLowerCase();
      });

      toleranceRange.addEventListener("input", function () {
        toleranceValue.textContent = toleranceRange.value;
      });

      coverageRange.addEventListener("input", function () {
        coverageValue.textContent = coverageRange.value + "%";
      });

      syncVisibleConfig();

      ["dragenter", "dragover"].forEach(function (eventName) {
        dropzone.addEventListener(eventName, function (event) {
          event.preventDefault();
          dropzone.classList.add("is-dragging");
        });
      });

      ["dragleave", "drop"].forEach(function (eventName) {
        dropzone.addEventListener(eventName, function (event) {
          event.preventDefault();
          dropzone.classList.remove("is-dragging");
        });
      });

      dropzone.addEventListener("drop", function (event) {
        if (!event.dataTransfer || !event.dataTransfer.files) return;
        addFiles(event.dataTransfer.files);
      });

      input.addEventListener("change", function () {
        addFiles(input.files);
        input.value = "";
      });

      processButton.addEventListener("click", function () {
        if (!state.files.length) {
          statusText.textContent = "add images first.";
          return;
        }
        processFiles();
      });

      clearButton.addEventListener("click", function () {
        state.files.forEach(revokeFilePreview);
        state.results.forEach(revokeResultPreview);
        state.files = [];
        state.results = [];
        renderResults();
        statusText.textContent = "no images selected.";
      });

      downloadAllButton.addEventListener("click", async function () {
        if (!state.results.length) return;
        downloadAllButton.disabled = true;
        statusText.textContent = "Preparing downloads...";
        for (const result of state.results) {
          await downloadResult(result);
          await wait(140);
        }
        statusText.textContent = "downloaded.";
        downloadAllButton.disabled = false;
      });

      function addFiles(fileList) {
        const images = Array.from(fileList || []).filter(function (file) {
          return file.type && file.type.indexOf("image/") === 0;
        });

        if (!images.length) {
          statusText.textContent = "no valid images found.";
          return;
        }

        images.forEach(function (file) {
          state.files.push({
            file: file,
            previewUrl: URL.createObjectURL(file)
          });
        });

        statusText.textContent = state.files.length + " image" + (state.files.length > 1 ? "s selected." : " selected.");
        resultsSummary.textContent = state.files.length + " image" + (state.files.length > 1 ? "s." : ".");
        renderResults();
      }

      function getMode() {
        const checked = document.querySelector('input[name="trim-mode"]:checked');
        return checked ? checked.value : "auto";
      }

      function getToolMode() {
        const checked = document.querySelector('input[name="tool-mode"]:checked');
        return checked ? checked.value : "trim";
      }

      function getPadRatio() {
        const checked = document.querySelector('input[name="pad-ratio"]:checked');
        return checked ? checked.value : "4:5";
      }

      function getPadColor() {
        return padBgColor.value || "#ffffff";
      }

      function syncVisibleConfig() {
        const toolMode = getToolMode();
        trimConfig.hidden = toolMode !== "trim";
        padConfig.hidden = toolMode !== "pad";
      }

      async function processFiles() {
        processButton.disabled = true;
        downloadAllButton.disabled = true;
        state.results.forEach(revokeResultPreview);
        state.results = [];
        renderResults();

        const options = {
          toolMode: getToolMode(),
          trimMode: getMode(),
          tolerance: Number(toleranceRange.value),
          coverage: Number(coverageRange.value) / 100,
          padRatio: getPadRatio(),
          padColor: getPadColor()
        };

        statusText.textContent = "processing...";

        for (let index = 0; index < state.files.length; index += 1) {
          const item = state.files[index];
          try {
            const result = await buildProcessedResult(item.file, item.previewUrl, options);
            state.results.push(result);
            statusText.textContent = (index + 1) + " / " + state.files.length;
            renderResults();
          } catch (error) {
            state.results.push({
              fileName: item.file.name,
              error: error && error.message ? error.message : "error"
            });
            renderResults();
          }
        }

        processButton.disabled = false;
        const successCount = state.results.filter(function (result) { return !result.error; }).length;
        resultsSummary.textContent = successCount + " / " + state.results.length;
        statusText.textContent = successCount ? "done." : "error.";
        downloadAllButton.disabled = !successCount;
      }

      async function buildProcessedResult(file, sourceUrl, options) {
        const image = await loadImage(sourceUrl);
        const workingCanvas = document.createElement("canvas");
        workingCanvas.width = image.naturalWidth;
        workingCanvas.height = image.naturalHeight;
        const workingContext = workingCanvas.getContext("2d", { willReadFrequently: true });
        workingContext.drawImage(image, 0, 0);

        let analysis;
        let exportCanvas;

        if (options.toolMode === "pad") {
          analysis = buildPadBounds(image.naturalWidth, image.naturalHeight, options.padRatio);
          exportCanvas = document.createElement("canvas");
          exportCanvas.width = analysis.width;
          exportCanvas.height = analysis.height;
          const exportContext = exportCanvas.getContext("2d");
          exportContext.fillStyle = options.padColor;
          exportContext.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
          exportContext.drawImage(
            workingCanvas,
            0,
            0,
            workingCanvas.width,
            workingCanvas.height,
            analysis.drawLeft,
            analysis.drawTop,
            workingCanvas.width,
            workingCanvas.height
          );
        } else {
          const imageData = workingContext.getImageData(0, 0, workingCanvas.width, workingCanvas.height);
          analysis = detectCropBounds(imageData, options.trimMode, options.tolerance, options.coverage);
          exportCanvas = document.createElement("canvas");
          exportCanvas.width = analysis.width;
          exportCanvas.height = analysis.height;
          const exportContext = exportCanvas.getContext("2d");
          exportContext.imageSmoothingEnabled = true;
          exportContext.imageSmoothingQuality = "high";
          exportContext.drawImage(
            workingCanvas,
            analysis.left,
            analysis.top,
            analysis.width,
            analysis.height,
            0,
            0,
            analysis.width,
            analysis.height
          );
        }

        const mimeType = getExportMimeType(file.type);
        const blob = await canvasToBlob(exportCanvas, mimeType, 0.92);
        const previewUrl = URL.createObjectURL(blob);

        return {
          fileName: file.name,
          sourceUrl: sourceUrl,
          previewUrl: previewUrl,
          blob: blob,
          mimeType: mimeType,
          originalWidth: image.naturalWidth,
          originalHeight: image.naturalHeight,
          cropWidth: analysis.width,
          cropHeight: analysis.height,
          trimmed: analysis.trimmed,
          modeUsed: analysis.modeUsed,
          toolMode: options.toolMode,
          padRatio: options.padRatio,
          padColor: options.padColor,
          outputWidth: analysis.width,
          outputHeight: analysis.height,
          cropBox: {
            left: analysis.left,
            top: analysis.top,
            right: analysis.right,
            bottom: analysis.bottom
          }
        };
      }

      function detectCropBounds(imageData, mode, tolerance, coverage) {
        if (mode === "auto") {
          const sampledMode = {
            type: "sampled",
            color: sampleBorderColor(imageData)
          };
          const sampledResult = detectCropBoundsForMode(imageData, sampledMode, tolerance, coverage);
          const whiteResult = detectCropBoundsForMode(imageData, "white", tolerance, coverage);
          const blackResult = detectCropBoundsForMode(imageData, "black", tolerance, coverage);
          const sampledGain = cropGain(sampledResult, imageData.width, imageData.height);
          const whiteGain = cropGain(whiteResult, imageData.width, imageData.height);
          const blackGain = cropGain(blackResult, imageData.width, imageData.height);

          if (sampledGain >= whiteGain && sampledGain >= blackGain) {
            return sampledResult;
          }

          if (blackGain > whiteGain) {
            return blackResult;
          }

          return whiteResult;
        }

        return detectCropBoundsForMode(imageData, mode, tolerance, coverage);
      }

      function sampleBorderColor(imageData) {
        const width = imageData.width;
        const height = imageData.height;
        const data = imageData.data;
        const samples = [];
        const step = Math.max(1, Math.floor(Math.max(width, height) / 120));

        function pushPixel(x, y) {
          const pointer = (y * width + x) * 4;
          const alpha = data[pointer + 3];
          if (alpha < 10) return;
          samples.push([
            data[pointer],
            data[pointer + 1],
            data[pointer + 2]
          ]);
        }

        for (let x = 0; x < width; x += step) {
          pushPixel(x, 0);
          pushPixel(x, height - 1);
        }

        for (let y = 0; y < height; y += step) {
          pushPixel(0, y);
          pushPixel(width - 1, y);
        }

        if (!samples.length) {
          return { red: 255, green: 255, blue: 255 };
        }

        const reds = samples.map(function (pixel) { return pixel[0]; }).sort(function (a, b) { return a - b; });
        const greens = samples.map(function (pixel) { return pixel[1]; }).sort(function (a, b) { return a - b; });
        const blues = samples.map(function (pixel) { return pixel[2]; }).sort(function (a, b) { return a - b; });
        const middle = Math.floor(samples.length / 2);

        return {
          red: reds[middle],
          green: greens[middle],
          blue: blues[middle]
        };
      }

      function buildPadBounds(width, height, ratioText) {
        const parts = String(ratioText).split(":").map(Number);
        const ratio = parts[0] / parts[1];
        const sourceRatio = width / height;
        let outputWidth = width;
        let outputHeight = height;

        if (sourceRatio > ratio) {
          outputHeight = Math.ceil(width / ratio);
        } else {
          outputWidth = Math.ceil(height * ratio);
        }

        const drawLeft = Math.floor((outputWidth - width) / 2);
        const drawTop = Math.floor((outputHeight - height) / 2);

        return {
          left: 0,
          top: 0,
          right: width - 1,
          bottom: height - 1,
          width: outputWidth,
          height: outputHeight,
          drawLeft: drawLeft,
          drawTop: drawTop,
          trimmed: outputWidth !== width || outputHeight !== height,
          modeUsed: ratioText
        };
      }

      function detectCropBoundsForMode(imageData, mode, tolerance, coverage) {
        const width = imageData.width;
        const height = imageData.height;
        const modeLabel = typeof mode === "object" ? "auto" : mode;
        const maxHorizontalScan = Math.max(1, Math.floor(height * 0.45));
        const maxVerticalScan = Math.max(1, Math.floor(width * 0.45));

        const topScan = scanEdge({
          length: height,
          maxTrim: maxHorizontalScan,
          inspect: function (index) {
            return edgeCoverageRatio(imageData, "row", index, mode, tolerance);
          },
          coverage: coverage
        });

        const bottomScan = scanEdge({
          length: height,
          maxTrim: maxHorizontalScan,
          inspect: function (index) {
            return edgeCoverageRatio(imageData, "row", height - 1 - index, mode, tolerance);
          },
          coverage: coverage
        });

        const leftScan = scanEdge({
          length: width,
          maxTrim: maxVerticalScan,
          inspect: function (index) {
            return edgeCoverageRatio(imageData, "column", index, mode, tolerance);
          },
          coverage: coverage
        });

        const rightScan = scanEdge({
          length: width,
          maxTrim: maxVerticalScan,
          inspect: function (index) {
            return edgeCoverageRatio(imageData, "column", width - 1 - index, mode, tolerance);
          },
          coverage: coverage
        });

        const top = topScan.accepted ? topScan.trim : 0;
        const bottom = bottomScan.accepted ? height - bottomScan.trim - 1 : height - 1;
        const left = leftScan.accepted ? leftScan.trim : 0;
        const right = rightScan.accepted ? width - rightScan.trim - 1 : width - 1;

        if (right <= left || bottom <= top) {
          return {
            left: 0,
            top: 0,
            right: width - 1,
            bottom: height - 1,
            width: width,
            height: height,
            trimmed: false,
            modeUsed: modeLabel
          };
        }

        return {
          left: left,
          top: top,
          right: right,
          bottom: bottom,
          width: right - left + 1,
          height: bottom - top + 1,
          trimmed: top > 0 || left > 0 || right < width - 1 || bottom < height - 1,
          modeUsed: modeLabel
        };
      }

      function scanEdge(config) {
        let trim = 0;
        let sawBorder = false;
        const limit = Math.min(config.length, config.maxTrim);

        for (let index = 0; index < limit; index += 1) {
          const ratio = config.inspect(index);
          if (ratio >= config.coverage) {
            trim += 1;
            sawBorder = true;
            continue;
          }
          return {
            trim: trim,
            accepted: sawBorder
          };
        }

        return {
          trim: 0,
          accepted: false
        };
      }

      function edgeCoverageRatio(imageData, axis, index, mode, tolerance) {
        const data = imageData.data;
        const width = imageData.width;
        const height = imageData.height;
        const total = axis === "row" ? width : height;
        let matches = 0;
        const sampledThreshold = Math.max(18, tolerance * 2);
        const sampledThresholdSquared = sampledThreshold * sampledThreshold;

        for (let step = 0; step < total; step += 1) {
          const x = axis === "row" ? step : index;
          const y = axis === "row" ? index : step;
          const pointer = (y * width + x) * 4;
          const alpha = data[pointer + 3];

          if (alpha < 10) {
            matches += 1;
            continue;
          }

          const red = data[pointer];
          const green = data[pointer + 1];
          const blue = data[pointer + 2];

          if (typeof mode === "object" && mode.type === "sampled") {
            const redDiff = red - mode.color.red;
            const greenDiff = green - mode.color.green;
            const blueDiff = blue - mode.color.blue;
            const distanceSquared = (redDiff * redDiff) + (greenDiff * greenDiff) + (blueDiff * blueDiff);
            if (distanceSquared <= sampledThresholdSquared) {
              matches += 1;
            }
          } else if (mode === "white") {
            if (red >= 255 - tolerance && green >= 255 - tolerance && blue >= 255 - tolerance) {
              matches += 1;
            }
          } else {
            if (red <= tolerance && green <= tolerance && blue <= tolerance) {
              matches += 1;
            }
          }
        }

        return matches / total;
      }

      function cropGain(result, width, height) {
        return (width * height) - (result.width * result.height);
      }

      function getExportMimeType(inputType) {
        if (inputType === "image/jpeg" || inputType === "image/webp" || inputType === "image/png") {
          return inputType;
        }
        return "image/png";
      }

      function buildDownloadName(result) {
        const extension = extensionForMimeType(result.mimeType);
        const baseName = result.fileName.replace(/\.[^.]+$/, "");
        const suffix = result.toolMode === "pad" ? "-padded-" + result.padRatio.replace(":", "x") : "-trimmed";
        return baseName + suffix + "." + extension;
      }

      function extensionForMimeType(mimeType) {
        if (mimeType === "image/jpeg") return "jpg";
        if (mimeType === "image/webp") return "webp";
        return "png";
      }

      function canvasToBlob(canvas, mimeType, quality) {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(function (blob) {
            if (blob) {
              resolve(blob);
              return;
            }
            reject(new Error("export failed."));
          }, mimeType, quality);
        });
      }

      function loadImage(url) {
        return new Promise(function (resolve, reject) {
          const image = new Image();
          image.onload = function () {
            resolve(image);
          };
          image.onerror = function () {
            reject(new Error("load failed."));
          };
          image.src = url;
        });
      }

      function renderResults() {
        if (!state.files.length && !state.results.length) {
          resultsGrid.innerHTML = '<div class="edge-trim-empty">processed images appear here.</div>';
          resultsSummary.textContent = "add images to start.";
          downloadAllButton.disabled = true;
          return;
        }

        if (state.files.length && !state.results.length) {
          resultsGrid.innerHTML = state.files.map(function (item) {
            return [
              '<div class="edge-trim-card">',
              '<div class="edge-trim-card-top">',
              '<div>',
              '<h3 class="edge-trim-card-title">' + escapeHtml(item.file.name) + '</h3>',
              '<div class="edge-trim-status">waiting.</div>',
              '</div>',
              '<div class="edge-trim-badge">queued</div>',
              '</div>',
              '<div class="edge-trim-card-actions"><button class="edge-trim-secondary-button" type="button" disabled>waiting</button></div>',
              "</div>"
            ].join("");
          }).join("");
          return;
        }

        resultsGrid.innerHTML = state.results.map(function (result) {
          if (result.error) {
            return [
              '<div class="edge-trim-card">',
              '<div class="edge-trim-card-top">',
              '<div>',
              '<h3 class="edge-trim-card-title">' + escapeHtml(result.fileName) + '</h3>',
              '<div class="edge-trim-status">' + escapeHtml(result.error) + '</div>',
              '</div>',
              '<div class="edge-trim-badge">error</div>',
              '</div>',
              '</div>'
            ].join("");
          }

          return [
            '<div class="edge-trim-card">',
            '<div class="edge-trim-card-top">',
            '<div>',
            '<h3 class="edge-trim-card-title">' + escapeHtml(result.fileName) + '</h3>',
            '<div class="edge-trim-status">' + getResultStatus(result) + '</div>',
            '</div>',
            '<div class="edge-trim-badge">' + escapeHtml(result.toolMode) + '</div>',
            '</div>',
            '<div class="edge-trim-preview-grid">',
            '<div class="edge-trim-preview">',
            '<div class="edge-trim-preview-label">original</div>',
            '<img src="' + result.sourceUrl + '" alt="">',
            '</div>',
            '<div class="edge-trim-preview">',
            '<div class="edge-trim-preview-label">output</div>',
            '<img src="' + result.previewUrl + '" alt="">',
            '</div>',
            '</div>',
            '<div class="edge-trim-metrics">',
            '<span>output ' + result.outputWidth + ' × ' + result.outputHeight + '</span>',
            '<span>' + getResultMeta(result) + '</span>',
            '</div>',
            '<div class="edge-trim-card-actions">',
            '<button class="edge-trim-button" type="button" data-download="' + escapeHtml(result.fileName) + '">download</button>',
            '</div>',
            '</div>'
          ].join("");
        }).join("");

        Array.from(resultsGrid.querySelectorAll("[data-download]")).forEach(function (button) {
          button.addEventListener("click", function () {
            const targetName = button.getAttribute("data-download");
            const result = state.results.find(function (item) {
              return !item.error && item.fileName === targetName;
            });
            if (result) {
              downloadResult(result);
            }
          });
        });
      }

      async function downloadResult(result) {
        const url = URL.createObjectURL(result.blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = buildDownloadName(result);
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }

      function wait(delay) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, delay);
        });
      }

      function revokeFilePreview(item) {
        if (item && item.previewUrl) {
          URL.revokeObjectURL(item.previewUrl);
        }
      }

      function revokeResultPreview(result) {
        if (result && result.previewUrl) {
          URL.revokeObjectURL(result.previewUrl);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function capitalize(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function getResultStatus(result) {
        if (result.toolMode === "pad") {
          return result.trimmed ? "padded." : "already fits.";
        }
        return result.trimmed ? "trimmed." : "unchanged.";
      }

      function getResultMeta(result) {
        if (result.toolMode === "pad") {
          return "ratio " + result.modeUsed;
        }
        return "mode " + (result.modeUsed === "auto" ? "auto" : capitalize(result.modeUsed));
      }
    })();
  </script>
